schema_version = "1.0"

[[artifacts]]
source = "/logs/agent/solution.patch"
destination = "solution.patch"

[metadata]
benchmark = "swepmv2"
instance_id = "Open-Legal-Products__mike-299"
repository = "Open-Legal-Products/mike"
language = "typescript"
base_commit = "169ec3e48ae5d6336d90d32b5a04f0b5e60dcc0a"
category = "debugging"

[verifier]
