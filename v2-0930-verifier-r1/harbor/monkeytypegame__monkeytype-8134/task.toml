schema_version = "1.0"

[[artifacts]]
source = "/logs/agent/solution.patch"
destination = "solution.patch"

[metadata]
benchmark = "swepmv2"
instance_id = "monkeytypegame__monkeytype-8134"
repository = "monkeytypegame/monkeytype"
language = "typescript"
base_commit = "a7ee6c9be33714fe25c213efcd2f4ff4c9ff007f"
